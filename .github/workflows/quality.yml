name: Quality

on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    project:
        name: Project (${{ matrix.php }})
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
              with:
                  php-version: ${{ matrix.php }}
                  extensions: zip, mysqli
                  tools: composer:v2
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
              with:
                  version: 11.13.1
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
              with:
                  node-version: 24.21.0
                  cache: pnpm
            - run: composer install --no-interaction --no-progress --prefer-dist
            - run: composer check
            - run: pnpm install --frozen-lockfile
            - run: pnpm check

    quality:
        name: Quality aggregate
        if: always()
        needs: [project, release-asset]
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - run: test "${{ needs.project.result }}" = success && test "${{ needs.release-asset.result }}" = success

    release-asset:
        name: Release asset
        needs: project
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_DATABASE: wordpress
                    MYSQL_USER: wordpress
                    MYSQL_PASSWORD: wordpress
                    MYSQL_ROOT_PASSWORD: root
                ports: ['3306:3306']
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
                    --health-interval=10s --health-timeout=5s --health-retries=10
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
              with:
                  php-version: '8.4'
                  extensions: zip, mysqli
                  tools: composer:v2, wp-cli:2.12.0
            - run: composer install --no-interaction --no-progress --prefer-dist
            - run: python3 scripts/build-plugin-zip.py --output-dir build
            - name: Install and activate exact archive on WordPress 7
              env:
                  WORDPRESS_DB_HOST: 127.0.0.1
                  WORDPRESS_DB_NAME: wordpress
                  WORDPRESS_DB_USER: wordpress
                  WORDPRESS_DB_PASSWORD: wordpress
              run: |
                  set -euo pipefail
                  wp core download --version=7.0 --path=/tmp/wordpress --allow-root
                  wp config create --path=/tmp/wordpress --dbname="$WORDPRESS_DB_NAME" --dbuser="$WORDPRESS_DB_USER" --dbpass="$WORDPRESS_DB_PASSWORD" --dbhost="$WORDPRESS_DB_HOST" --skip-check --allow-root
                  wp core install --path=/tmp/wordpress --url=http://example.test --title=Quality --admin_user=admin --admin_password=password --admin_email=admin@example.test --skip-email --allow-root
                  archive="build/$(python3 -c 'import json; print(json.load(open("build/manifest.json"))["archive"])')"
                  wp plugin install "$archive" --path=/tmp/wordpress --activate --allow-root
                  wp plugin is-active ran-wp-release-updater-example --path=/tmp/wordpress --allow-root
                  test "$(wp plugin get ran-wp-release-updater-example --path=/tmp/wordpress --field=version --allow-root)" = "$(python3 -c 'import json; print(json.load(open("build/manifest.json"))["version"])')"
            - run: python3 scripts/promotion-manifest.py --archive "build/$(python3 -c 'import json; print(json.load(open("build/manifest.json"))["archive"])')" --manifest build/manifest.json --output build/ran-profile-b-promotion.json
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ran-wp-release-updater-example-promotion-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      build/*.zip
                      build/ran-profile-b-promotion.json
                  if-no-files-found: error
